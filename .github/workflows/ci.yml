name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: scripts/test.sh
      - name: Contrast audit
        run: |
          scripts/contrast.sh
          scripts/contrast.sh --increased
